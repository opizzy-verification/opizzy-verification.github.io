<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opizzy Concept – Uploading / Verification Requirements</title>
<style>
:root{--navy:#0d1b4c;--gold:#f4b400;--ink:#16213f;--page:#e9ecf3;--card:#fff;--line:#c9d0e2;--err:#c0262d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a0f24}}
:root[data-theme="dark"]{--page:#0a0f24}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 85% -5%,rgba(244,180,0,.28),transparent 45%),linear-gradient(160deg,#0d1b4c,#08122f);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:18px 14px;min-height:100%}
.card{width:100%;max-width:520px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.4);align-self:flex-start}
header{background:linear-gradient(135deg,#0d1b4c,#1a3577);color:#fff;padding:22px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--gold)}
.logo{flex:none;width:54px;height:54px;border-radius:50%;background:#0d1b4c;border:3px solid var(--gold);display:grid;place-items:center;font-weight:900;font-size:20px}.logo span{color:var(--gold)}
header small{color:var(--gold);font-weight:700;font-size:13px}
header h1{font-size:19px;line-height:1.25;margin-top:4px}
.bar{height:8px;background:#e3e8f5}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4b400,#ffd24d);border-radius:0 8px 8px 0;transition:width .35s}
.body{padding:22px}
.step-label{display:inline-block;font-size:13px;font-weight:700;color:#7a5a00;background:#fff3cf;padding:4px 12px;border-radius:20px}
h2{font-size:23px;margin:10px 0 4px;color:var(--navy)}
.hint{font-size:14px;color:#4b5679;margin-bottom:14px;line-height:1.4}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#f7f9fd;color:var(--ink)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid rgba(244,180,0,.45);outline-offset:1px;border-color:var(--gold);background:#fff}
.err{color:var(--err);font-size:14px;font-weight:600;margin-top:8px;min-height:18px}
.row{display:flex;gap:10px;margin-top:18px}
.rr{display:flex;gap:8px;margin-top:8px}.rs{flex:1;min-width:0}.rg,.rk{width:auto;flex:none;padding:12px 6px}
button{font:inherit;font-weight:800;font-size:16px;padding:14px 20px;border-radius:12px;border:0;cursor:pointer}
.next{background:var(--gold);color:var(--navy);flex:1;box-shadow:0 6px 14px rgba(244,180,0,.4)}
.back{background:#e6eaf5;color:var(--navy)}
.sum{list-style:none;padding:0}
.sum li{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum b{display:block;font-size:12px;color:#5a6690}
.wa{display:block;text-align:center;text-decoration:none;background:#1fa855;color:#fff;font-weight:800;padding:16px;border-radius:12px;margin-top:18px;box-shadow:0 6px 14px rgba(31,168,85,.4)}
.note{font-size:12.5px;color:#5a6690;margin-top:12px;line-height:1.4}
footer{background:var(--navy);color:var(--gold);text-align:center;font-weight:800;padding:15px;font-size:16px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.body>*{animation:in .3s ease both}
@media (prefers-reduced-motion:reduce){.body>*{animation:none}}
</style>
</head>
<body>
<main class="card">
  <header><div class="logo">O<span>C</span></div><div><small>OPIZZY CONCEPT</small><h1>UPLOADING / VERIFICATION REQUIREMENTS</h1></div></header>
  <div class="bar"><i id="prog"></i></div>
  <div class="body" id="body"></div>
  <footer>OPIZZY CONCEPT ✅🖨️🎓</footer>
</main>
<script>
var WA="2348063279523";
var data={nin:"",exam:"WAEC",examno:"",year:"",exam2:"WAEC",examno2:"",year2:"",sittings:"1",email:"",phone:"",results:[]};
var step=0,N=5;
var year=new Date().getFullYear();
var steps=[
 {t:"National Identification Number (NIN)",h:"Your NIN must be linked to your profile.",
  f:function(){return '<label for="nin">NIN (11 digits)</label><input id="nin" inputmode="numeric" maxlength="11" autocomplete="off" value="'+data.nin+'">'},
  v:function(){var x=val("nin");if(!/^\d{11}$/.test(x))return"NIN must be exactly 11 digits.";data.nin=x;}},
 {t:"Examination details",h:"Enter your WAEC or NECO examination number and year.",
  f:function(){var o="";for(var y=year;y>=year-25;y--)o+='<option'+(String(y)===data.year?' selected':'')+'>'+y+'</option>';
   return '<label for="sittings">How many sittings do you have?</label><select id="sittings"><option value="1"'+(data.sittings==="1"?' selected':'')+'>One sitting</option><option value="2"'+(data.sittings==="2"?' selected':'')+'>Two sittings</option></select><label for="exam">Examination</label><select id="exam"><option'+(data.exam==="WAEC"?' selected':'')+'>WAEC</option><option'+(data.exam==="NECO"?' selected':'')+'>NECO</option></select>'+
   '<label for="examno">Examination number</label><input id="examno" autocomplete="off" value="'+data.examno+'">'+
   '<label for="year">Examination year</label><select id="year">'+o+'</select>'+
   '<div id="second"'+(data.sittings==="2"?'':' hidden')+'><h3 style="margin:22px 0 2px;font-size:16px;color:var(--navy)">Second sitting</h3><p class="hint" style="margin-bottom:0">Enter the details of your second sitting.</p>'+
   '<label for="exam2">Examination</label><select id="exam2"><option'+(data.exam2==="WAEC"?' selected':'')+'>WAEC</option><option'+(data.exam2==="NECO"?' selected':'')+'>NECO</option></select>'+
   '<label for="examno2">Examination number</label><input id="examno2" autocomplete="off" value="'+data.examno2+'">'+
   '<label for="year2">Examination year</label><select id="year2"><option value="">Select year</option>'+yopts(data.year2)+'</select></div>'},
  v:function(){var n=val("examno");if(n.length<8)return"Enter your full examination number.";var two=val("sittings")==="2",n2=val("examno2"),y2=val("year2");if(two){if(n2.length<8)return"Enter the full examination number for your second sitting.";if(!y2)return"Select the year for your second sitting.";}else{n2="";y2="";}data.sittings=val("sittings");data.exam=val("exam");data.examno=n;data.year=val("year");data.exam2=val("exam2");data.examno2=n2;data.year2=y2;}},
 {t:"Email and phone number",h:"Use an email you can open and a working GSM number.",
  f:function(){return '<label for="email">Valid email address</label><input id="email" type="email" autocomplete="off" value="'+data.email+'">'+
   '<label for="phone">GSM phone number</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="off" value="'+data.phone+'">'},
  v:function(){var e=val("email"),p=val("phone");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return"Enter a valid email address.";if(!/^0\d{10}$/.test(p))return"Phone number must be 11 digits, starting with 0.";data.email=e;data.phone=p;}},
 {t:"Subject results",h:"Enter each subject with its grade exactly as shown on your result, e.g. Mathematics B3. Enter at least 5 subjects. If you added a second examination, pick the sitting for each subject.",
  f:function(){return resRows()},
  v:function(){var a=readRows(),n=0,seen={};for(var i=0;i<a.length;i++){var r=a[i];if(!r.s&&!r.g)continue;if(!r.s||!r.g)return"Row "+(i+1)+": enter both the subject and the grade.";var key=r.s.toLowerCase()+r.k;if(seen[key])return"Row "+(i+1)+": "+r.s+" is entered twice.";seen[key]=1;n++;}if(n<5)return"Enter at least 5 subjects with their grades.";data.results=a;}}
];
function val(id){return document.getElementById(id).value.trim()}
function yopts(sel){var o="";for(var y=year;y>=year-25;y--)o+='<option'+(String(y)===sel?' selected':'')+'>'+y+'</option>';return o}
var SUBS=["English Language","Mathematics","Biology","Chemistry","Physics","Further Mathematics","Economics","Government","Literature in English","Civic Education","Geography","Agricultural Science","Commerce","Financial Accounting","Christian Religious Studies","Islamic Studies","Yoruba","Technical Drawing","Computer Studies","Data Processing"];
var GR=["A1","B2","B3","C4","C5","C6","D7","E8","F9"];
function resRows(){var two=!!data.examno2,h='<datalist id="subs">'+SUBS.map(function(s){return'<option value="'+s+'">'}).join("")+'</datalist>';
 for(var i=0;i<9;i++){var r=data.results[i]||{s:"",g:"",k:"1"};
  h+='<div class="rr"><input class="rs" list="subs" placeholder="Subject" aria-label="Subject '+(i+1)+'" value="'+esc(r.s)+'">'+
  '<select class="rg" aria-label="Grade '+(i+1)+'"><option value="">Grade</option>'+GR.map(function(g){return'<option'+(g===r.g?' selected':'')+'>'+g+'</option>'}).join("")+'</select>'+
  (two?'<select class="rk" aria-label="Sitting '+(i+1)+'"><option value="1"'+(r.k==="1"?' selected':'')+'>1st</option><option value="2"'+(r.k==="2"?' selected':'')+'>2nd</option></select>':'')+'</div>';}
 return h}
function readRows(){var s=document.querySelectorAll(".rs"),g=document.querySelectorAll(".rg"),k=document.querySelectorAll(".rk"),a=[];for(var i=0;i<s.length;i++)a.push({s:s[i].value.trim(),g:g[i].value,k:k[i]?k[i].value:"1"});return a}
function resList(){return data.results.filter(function(r){return r.s}).map(function(r){return r.s+" "+r.g+(data.examno2?" ("+(r.k==="2"?"2nd":"1st")+" sitting)":"")})}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var b=document.getElementById("body");
  document.getElementById("prog").style.width=(step/(N-1)*100)+"%";
  if(step<steps.length){
    var s=steps[step];
    b.innerHTML='<div class="step-label">Step '+(step+1)+' of '+(N-1)+'</div><h2>'+s.t+'</h2><p class="hint">'+s.h+'</p>'+s.f()+
    '<div class="err" id="err" role="alert"></div><div class="row">'+(step?'<button class="back" id="back">Back</button>':'')+'<button class="next" id="next">'+(step===steps.length-1?'Review':'Next')+'</button></div>';
    document.getElementById("next").onclick=function(){var m=s.v();if(m){document.getElementById("err").textContent=m;return}step++;render()};
    if(step)document.getElementById("back").onclick=function(){step--;render()};
    var sb=document.getElementById("sittings");if(sb)sb.onchange=function(){document.getElementById("second").hidden=sb.value!=="2"};var first=b.querySelector("input,textarea,select");if(first)first.focus();
  }else{
    var items=[["NIN",data.nin],[data.exam+" examination number",data.examno],["Examination year",data.year]];if(data.examno2)items.push([data.exam2+" examination number (2nd)",data.examno2],["Examination year (2nd)",data.year2]);items.push(["Email",data.email],["Phone",data.phone],["Subject results",resList().join(", ")]);
    var msg="UPLOADING/VERIFICATION REQUIREMENTS\nNIN: "+data.nin+"\n"+data.exam+" Exam No: "+data.examno+"\nExam Year: "+data.year+(data.examno2?"\n"+data.exam2+" Exam No (2nd): "+data.examno2+"\nExam Year (2nd): "+data.year2:"")+"\nEmail: "+data.email+"\nPhone: "+data.phone+"\nResults: "+resList().join(", ");
    b.innerHTML='<div class="step-label">Final check</div><h2>Confirm your details</h2><ul class="sum">'+items.map(function(i){return'<li><b>'+i[0]+'</b>'+esc(i[1])+'</li>'}).join("")+'</ul>'+
    '<div class="row"><button class="back" id="back">Edit</button></div>'+
    '<a class="wa" href="https://wa.me/'+WA+'?text='+encodeURIComponent(msg)+'">Send to Opizzy Concept on WhatsApp</a>'+
    '<p class="note">Your details are not saved or stored on this page. They are only sent when you tap the WhatsApp button.</p>';
    document.getElementById("back").onclick=function(){step=steps.length-1;render()};
  }
}
render();
</script>
</body>
</html>
